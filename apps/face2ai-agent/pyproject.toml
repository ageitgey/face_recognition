[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face2ai-agent"
version = "0.1.0"
description = "Voice agent for Face2AI: talks to you and knows who is in front of the camera (consumes Face2AI presence events)."
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents[openai,silero,turn-detector]>=1.6,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
groq = ["livekit-plugins-groq>=1.6,<2"]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio>=1.0,<2",
]

[project.scripts]
face2ai-agent = "face2ai_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
